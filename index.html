<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazil Moon 86+ | Special Coffee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            position: relative;
            padding: 20px;
        }

        /* Dark overlay to ensure text and card stand out over the artwork */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 520px;
            width: 100%;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #f4c430; /* Moonlit Gold */
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 24px;
            font-style: italic;
        }

        .profile-info {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }

        .btn-whatsapp:hover {
            background-color: #1eb957;
            transform: translateY(-2px);
        }

        .btn-email {
            background-color: #ffffff;
            color: #111111;
        }

        .btn-email:hover {
            background-color: #e2e2e2;
            transform: translateY(-2px);
        }

        .contact-detail {
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <h1>Brazil Moon 86+</h1>
        <p class="subtitle">O café de exportação... que fica.</p>

        <div class="profile-info">
            <div class="profile-name">Stephen Couillard</div>
        </div>

        <div class="btn-group">
            <a href="https://wa.me/5522999506136" class="btn btn-whatsapp" target="_blank">
                💬 Chat on WhatsApp
            </a>
            <a href="mailto:stephen.beantobrand.cafe@gmail.com" class="btn btn-email">
                ✉️ Send Email
            </a>
        </div>

        <div class="contact-detail">
            <p><strong>WhatsApp:</strong> +55 (22) 99950-6136</p>
            <p><strong>Email:</strong> stephen.beantobrand.cafe@gmail.com</p>
        </div>
    </div>

</body>
</html>
